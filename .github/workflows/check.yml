name: Check complaints

on:
  schedule:
    - cron: '7 * * * *'   # Запуск каждый час (на 7-й минуте часа)
  workflow_dispatch:     # Разрешает запускать вручную кнопкой в интерфейсе GitHub

permissions:
  contents: write        # Нужно, чтобы скрипт мог делать git commit и обновлять last_report_id.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # Лимит времени на один запуск (чтобы не превысить лимиты GitHub Actions)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run the checker script
        env:
          RAW_COOKIE: \${{ secrets.RAW_COOKIE }}
          TG_BOT_TOKEN: \${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: \${{ secrets.TG_CHAT_ID }}
        run: python bot.py
